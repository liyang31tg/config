[startup]
tiled = true
daemon = true
open_default_window = true
layout = "bsp"
start_in_terminal_mode = true
[appearance]
# 窗格之间空隙，最小 0（默认就是0）
gap = 0
# 共享边框：相邻窗格共用一条分隔线，消除双边框，省空间
shared_borders = true
# 焦点边框亮青色，非焦点浅灰
border_focused_color = "#4cc9f0"
border_unfocused_color = "#444444"
# 弹窗/设置面板内部padding，最小值 1（范围1~6）
panel_padding = 1
# 边框样式，选细线：normal / ascii；不要 thick/double
border_style = "normal"
# 隐藏标题栏，进一步省纵向空间
window_title_position = "hidden"
# 顶部dock栏隐藏
dockbar_position = "top"
show_clock = true
show_cpu = true
show_ram = true
theme = "nord"
nvim_navigation = false
zoom_size = 100
global_session = true
[appearance.sidebar]
enabled = true
position = "hidden"
width = 62
row_style = "bar"
header_style = "icon"
density = "normal"
show_numbers = false
folder_click = "navigate"
file_delete = "trash"
tooltips = true

[workspaces]
new_window_when_empty = true


[keybindings.terminal_mode]
terminal_exit_mode = ["shift+esc", "alt+esc"]

[keybindings.global]
command_palette = ["ctrl+shift+p"]
split_vertical = ["super+d"]
split_horizontal = ["super+shift+d"]
prefix_session_switcher = ["alt+s"]
terminal_focus_left = ["super+h"]
terminal_focus_down = ["super+j"]
terminal_focus_up = ["super+k"]
terminal_focus_right = ["super+l"]
workspace_prefix_switch_1 = ["super+1"]
workspace_prefix_switch_2 = ["super+2"]
workspace_prefix_switch_3 = ["super+3"]
workspace_prefix_switch_4 = ["super+4"]
workspace_prefix_switch_5 = ["super+5"]
workspace_prefix_switch_6 = ["super+6"]
workspace_prefix_switch_7 = ["super+7"]
workspace_prefix_switch_8 = ["super+8"]
workspace_prefix_switch_9 = ["super+9"]
prefix_explore = ["super+e"]

[spotlight]
enabled = false

[dock]
right = ["transfers", "notifications", "copy-help", "cpu", "ram", "clock", "session-controls", "session"]

[appearance.sidebar.left]
width = 30
